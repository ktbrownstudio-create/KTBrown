<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | KT Brown</title>
  <meta name="description" content="Contact KT Brown for enquiries, collaborations and launch updates.">
  <meta name="theme-color" content="#ff0099">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site">
    <a class="brand" href="home.html">KT Brown</a>
    <nav aria-label="Main">
      <ul>
        <li><a href="home.html">Home</a></li>
        <li><a href="collection.html">Collection</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html" aria-current="page">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <div class="wrap">
        <p class="eyebrow">Contact</p>
        <h2>We'd love to hear from you.</h2>
        <div class="contact-grid">
          <div>
            <p class="lead">For enquiries, collaborations or launch updates, send us a message.</p>
            <p style="margin-top:22px"><strong style="font-weight:400">Email</strong><br>
              <a href="mailto:ktbrownstudio@gmail.com">ktbrownstudio@gmail.com</a></p>
            <!-- To add Instagram, add a line like:
            <p><strong>Instagram</strong><br><a href="https://instagram.com/YOURHANDLE">@YOURHANDLE</a></p> -->
          </div>

          <form id="contact-form">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" required autocomplete="name">
            <label for="email">Your email</label>
            <input id="email" name="email" type="email" required autocomplete="email">
            <label for="message">Message</label>
            <textarea id="message" name="message" required></textarea>
            <button class="btn dark" type="submit">Send Message</button>
            <p class="note">This opens your email app with your message ready to send.</p>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer class="site">
    <a href="home.html">Home</a><a href="collection.html">Collection</a><a href="about.html">About</a><a href="contact.html">Contact</a>
    <p>&copy; 2026 KT Brown</p>
  </footer>

  <script>
    document.getElementById('contact-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var n = document.getElementById('name').value;
      var em = document.getElementById('email').value;
      var m = document.getElementById('message').value;
      var body = m + '\n\n— ' + n + ' (' + em + ')';
      window.location.href = 'mailto:ktbrownstudio@gmail.com?subject=' +
        encodeURIComponent('Message from ' + n + ' via KT Brown website') +
        '&body=' + encodeURIComponent(body);
    });
  </script>
</body>
</html>
